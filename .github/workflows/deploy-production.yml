name: Deploy ASQA MIS frontend

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".env.production"
      - ".github/workflows/deploy-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asqamis-production-frontend
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: 103.132.98.245
      DEPLOY_USER: asqa
      DEPLOY_PORT: "2267"
      DEPLOY_DIR: /home/asqa/asqamis

    steps:
      - name: Check out frontend
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production frontend
        env:
          VITE_API_BASE_URL: /api
        run: npx vite build

      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY_B64" || { echo "DEPLOY_SSH_KEY_B64 is not configured"; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s' "$DEPLOY_SSH_KEY_B64" | tr -d '\r\n ' | base64 --decode > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' \
            '[103.132.98.245]:2267 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEJsL1ZgZhks/Mw/fR9opQqenxD/bdfKFzxItUPLWoYw' \
            > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" > /dev/null

      - name: Test SSH connection
        run: |
          ssh -p "$DEPLOY_PORT" -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "echo 'SSH connection successful'"

      - name: Copy frontend files to Ubuntu server
        run: |
          ssh -p "$DEPLOY_PORT" -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_DIR/frontend-dist'"
          rsync -az --delete \
            -e "ssh -p $DEPLOY_PORT -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/frontend-dist/"
          ssh -p "$DEPLOY_PORT" -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_DIR' && docker compose up -d --no-deps gateway && docker compose ps gateway"
